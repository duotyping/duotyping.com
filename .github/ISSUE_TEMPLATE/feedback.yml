name: Feedback
description: A bug, an idea, or a question about DuoTyping.
labels: [feedback]
body:
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Bug
        - Idea
        - Question
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you expected, what you got, and the steps to get there. Please don’t paste anything private you wrote — describe it instead.
      placeholder: Pressing ⌃⌥⌘D in Pages opens Write instead of checking my selection.
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: Your setup
      description: DuoTyping version (in About), your system (macOS, Windows or Chrome) and the provider you use.
      placeholder: DuoTyping 0.3.0 · Windows 11 24H2 · DuoTyping

  - type: textarea
    id: attachments
    attributes:
      label: Screenshot or recording
      description: Drag images or a screen recording into this box. Skip it if it doesn’t apply.
