name: Feedback
description: A bug, an idea, or a question about DuoTyping.
labels: [feedback]
body:
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Bug
        - Idea
        - Question
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you expected, what you got, and the steps to get there. Please don’t paste anything private you wrote — describe it instead.
      placeholder: Pressing ⌃⌥⌘D in Pages opens New Note instead of checking my selection.
    validations:
      required: true

  - type: input
    id: setup
    attributes:
      label: Your setup
      description: DuoTyping version (Settings › About), macOS version, and the model you use.
      placeholder: DuoTyping 1.0.0 · macOS 15.1 · Qwen3 4B Instruct

  - type: textarea
    id: attachments
    attributes:
      label: Screenshot or recording
      description: Drag images or a screen recording into this box. Skip it if it doesn’t apply.
