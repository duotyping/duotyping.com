<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F1EFE6" />
    <meta name="color-scheme" content="light" />
    <!-- The first screen's three faces, fetched with the HTML rather than after the inlined
         stylesheet that names them, so the headline types in Onest from its first letter. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/onest/files/onest-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2" />
    <!-- Google Analytics, for this website only (the app has no analytics), waits for consent:
         this sets its default to denied, and src/utils/consent.ts loads gtag.js after Accept. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', { analytics_storage: 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
